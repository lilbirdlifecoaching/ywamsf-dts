# YWAM SF admin service. Deploy: see service/README.md
name = "ywamsf-admin"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
REPO = "lilbirdlifecoaching/ywamsf-dts"
BRANCH = "main"
ALLOWED_ORIGINS = "https://ywamembers.org,https://www.ywamembers.org,https://ywamsanfrancisco.org,https://www.ywamsanfrancisco.org"
ADMIN_URL = "https://ywamsanfrancisco.org/admin/"
SITE_URL = "https://ywamsanfrancisco.org/"
MAIL_FROM = "YWAM SF website <website@ywamsanfrancisco.org>"

[[d1_databases]]
binding = "DB"
database_name = "ywamsf-admin"
database_id = "SET-BY-THE-DEPLOY-WORKFLOW"   # .github/workflows/deploy-service.yml looks it up by name
