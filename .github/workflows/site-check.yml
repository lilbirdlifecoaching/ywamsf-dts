# Live site check, Mon/Wed/Fri early morning (San Francisco) and on demand (Actions → "Site check" → Run workflow).
# 1. Repo checks: the admin page's code is valid, the sign-in service's tests pass, no keys or passwords were committed.
# 2. tools/site_check.mjs tests the live site: every page and link, old addresses, real-browser checks on desktop and phone,
#    the security policy, the sign-in service, the certificate, DNS and email records.
# The report is in the run's summary and in site-checks/latest.md on the `site-checks` branch (read by Claude's scheduled
# review). A failed run means something needs attention; GitHub emails the repo owner.
name: Site check

on:
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * 1,3,5'

permissions:
  contents: write

concurrency:
  group: site-checks-branch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Repo checks
        id: repo
        continue-on-error: true
        run: |
          f=0; : > repo-checks.md
          if node -e "new Function(require('fs').readFileSync('admin/admin.js','utf8'))"; then echo "- ✅ **Code:** the admin page's code is valid" >> repo-checks.md; else echo "- ❌ **Code:** admin/admin.js has a syntax error (the admin page won't open)" >> repo-checks.md; f=1; fi
          if (cd service && npm ci --no-audit --no-fund >/dev/null 2>&1 && node test/run.mjs > ../service-tests.log 2>&1); then echo "- ✅ **Code:** sign-in service tests pass ($(grep -o '[0-9]* checks passed' service-tests.log))" >> repo-checks.md; else echo "- ❌ **Code:** sign-in service tests fail: $(grep -v '^\s*at ' service-tests.log | tail -3 | tr '\n' ' ' | cut -c1-300)" >> repo-checks.md; f=1; fi
          hits=$(git grep -nIE 'ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|\bre_[A-Za-z0-9]{8,}_[A-Za-z0-9]{12,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|"private_key":\s*"-----' -- ':!*.min.js' ':!service/node_modules' | cut -d: -f1,2 | head -5)
          if [ -z "$hits" ]; then echo "- ✅ **Security:** no keys, tokens or passwords committed to the repository" >> repo-checks.md; else echo "- ❌ **Security:** possible key or token committed at: $(echo $hits | tr '\n' ' ')" >> repo-checks.md; f=1; fi
          aud=$(cd service && npm audit --omit=dev --json 2>/dev/null | node -e "let j='';process.stdin.on('data',d=>j+=d).on('end',()=>{try{const v=JSON.parse(j).metadata.vulnerabilities;console.log((v.high||0)+(v.critical||0))}catch(e){console.log(0)}})")
          if [ "${aud:-0}" = "0" ]; then echo "- ✅ **Security:** no known high-risk vulnerabilities in the sign-in service's packages" >> repo-checks.md; else echo "- ⚠️ **Security:** $aud high-risk vulnerability notice(s) in the sign-in service's packages (npm audit)" >> repo-checks.md; fi
          cat repo-checks.md
          exit $f
      - name: Install a browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Check the live site
        id: site
        continue-on-error: true
        run: node tools/site_check.mjs
      - name: Save the report
        if: always()
        run: |
          {
            if [ -f site-check-report.md ]; then head -4 site-check-report.md; else echo "# Site check: the live-site test didn't finish"; echo; fi
            echo "## Repository"; cat repo-checks.md 2>/dev/null; echo
            echo "## Live site"; tail -n +5 site-check-report.md 2>/dev/null
            echo; echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/out && cp report.md /tmp/out/latest.md && cp site-check-report.json /tmp/out/latest.json 2>/dev/null || true
          git config user.name "YWAM SF site check"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin site-checks 2>/dev/null && git checkout -q -B site-checks origin/site-checks || git checkout -q --orphan site-checks
          git rm -rq --cached . >/dev/null 2>&1 || true
          mkdir -p site-checks/history && cp /tmp/out/latest.md site-checks/latest.md && cp /tmp/out/latest.md "site-checks/history/$(date -u +%Y-%m-%d-%H%M).md"
          [ -f /tmp/out/latest.json ] && cp /tmp/out/latest.json site-checks/latest.json
          ls -1t site-checks/history/*.md | tail -n +61 | xargs -r rm -f
          git add site-checks && git commit -qm "Site check $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin site-checks
      - name: Fail if something is broken
        if: steps.repo.outcome == 'failure' || steps.site.outcome == 'failure'
        run: |
          echo "::error::The site check found problems. See the summary above."
          exit 1
