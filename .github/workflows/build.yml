# Rebuilds the YWAM 5 and YWAM 6 concepts from src/, and the main site (YWAM 7, at the top of ywamembers.org) from src7/, all from content/.
# Runs when the admin page saves a change, and every night so dates roll over
# (for example, the next DTS takes over the day after the current one starts).
name: Build site

on:
  push:
    branches: [main]
    paths: ['content/**', 'src/**', 'src7/**', 'tools/publish_root.py', '.github/workflows/build.yml']
  schedule:
    - cron: '17 8 * * *'   # about 1 am in San Francisco
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow (phone-sized photos for YWAM 7)
        run: pip install --quiet pillow || true
      - name: Build YWAM 5, 6 and the main site
        run: |
          V=5 python3 src/build.py
          V=6 python3 src/build.py
          ROOT_SITE=1 OUT=.site7 python3 src7/build.py
          python3 tools/publish_root.py
      - name: Publish if anything changed
        run: |
          git config user.name "YWAM SF site builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Rebuild site from content ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
